# LyricFlow AI (HTTP暫定 — certbot 実行で 443/リダイレクトへ自動昇格)
server {
    server_name lyricflow.aixr.tokyo.jp;

    # 音源・画像・Live2D のアップロードと、書き出しのフレーム送信(1枚ずつ)が通る大きさ。Cloudflare 無料プランの上限も 100MB
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:4189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    listen 80;
}
